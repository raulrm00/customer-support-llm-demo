<main class="flex min-h-dvh items-center justify-center bg-slate-50 px-4 py-12 sm:px-6 lg:px-8">
  <div class="w-full max-w-md space-y-8 rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
    <div>
      <h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-slate-900">
        Inicia sesión en tu cuenta
      </h2>
      <p class="mt-2 text-center text-sm text-slate-600">
        O
        <a routerLink="/register" class="font-medium text-teal-600 hover:text-teal-500">
          regístrate si aún no tienes cuenta
        </a>
      </p>
    </div>

    <form class="mt-8 space-y-6" [formGroup]="form" (ngSubmit)="login()">
      <div class="space-y-4 rounded-md shadow-sm">
        <div>
          <label for="email-address" class="block text-sm font-medium text-slate-700"
            >Correo electrónico</label
          >
          <input
            id="email-address"
            name="email"
            type="email"
            autocomplete="email"
            required
            class="relative block w-full rounded-md border border-slate-300 px-3 py-2 text-slate-900 placeholder-slate-500 focus:z-10 focus:border-teal-500 focus:outline-none focus:ring-teal-500 sm:text-sm"
            placeholder="ejemplo@correo.com"
            [formControl]="email"
          />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            class="relative block w-full rounded-md border border-slate-300 px-3 py-2 text-slate-900 placeholder-slate-500 focus:z-10 focus:border-teal-500 focus:outline-none focus:ring-teal-500 sm:text-sm"
            placeholder="••••••••"
            [formControl]="password"
          />
        </div>
      </div>

      @if (errorMessage()) {
        <div class="rounded-md bg-red-50 p-4">
          <p class="text-sm font-medium text-red-800">{{ errorMessage() }}</p>
        </div>
      }

      <div>
        <button
          type="submit"
          [disabled]="!form.valid || isLoading()"
          class="group relative flex w-full justify-center rounded-md bg-teal-600 px-3 py-2 text-sm font-semibold text-white hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2 disabled:bg-slate-300"
        >
          @if (isLoading()) {
            Iniciando sesión...
          } @else {
            Entrar
          }
        </button>
      </div>
    </form>
  </div>
</main>
